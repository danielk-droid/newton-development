name: Update Newton Projects

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update Newton development data
        run: node scripts/update-newton-projects.mjs

      - name: Configure Git
        run: |
          git config user.name "Newton Development Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated data
        run: |
          git add data/newton-source.json data/projects.ts

          if git diff --cached --quiet; then
            echo "No Newton project data changes detected."
            exit 0
          fi

          git commit -m "Update Newton development data"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push updated data
        run: git push origin HEAD:main