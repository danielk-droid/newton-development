name: Update Newton Development Data

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/update-newton-projects.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for this manual refresh"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-newton-development-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update Newton development data
        run: node scripts/update-newton-projects.mjs
      - name: Update official Newton GIS coordinates
        run: node scripts/update-newton-coordinates-v3.mjs
      - name: Validate verified project highlights
        run: node scripts/validate-project-highlights.mjs
      - name: Validate public-facing copy
        run: npm run validate:copy
      - name: Validate core data and GIS integrity
        env:
          SKIP_EVENT_HEALTH: "true"
        run: npm run validate:data
      - name: Write core data health summary
        env:
          SKIP_EVENT_HEALTH: "true"
        run: npm run report:data-health
      - name: Expand official project event coverage
        id: events
        continue-on-error: true
        run: node scripts/update-newton-expanded-events.mjs
      - name: Validate complete data integrity
        if: steps.events.outcome == 'success'
        run: npm run validate:data
      - name: Write complete data health summary
        if: steps.events.outcome == 'success'
        run: npm run report:data-health
      - name: Check generated data
        run: |
          node -e '
          const fs=require("fs");
          const data=JSON.parse(fs.readFileSync("data/newton-source.json","utf8"));
          const eventStatus=JSON.parse(fs.readFileSync("data/event-collection-status.json","utf8"));
          const coordinates=JSON.parse(fs.readFileSync("data/project-coordinates.json","utf8"));
          const coordinateStatus=JSON.parse(fs.readFileSync("data/coordinate-collection-status.json","utf8"));
          const eventsSucceeded=process.env.EVENTS_SUCCEEDED === "true";
          if(!Array.isArray(data.projects)||!data.projects.length) throw new Error("Newton project data is empty.");
          if(!Array.isArray(coordinates.projects)||!coordinates.projects.length) throw new Error("No Newton GIS project coordinates were resolved.");
          if(!coordinates.checkedAt) throw new Error("Newton GIS coordinate data is missing a checkedAt timestamp.");
          if(coordinateStatus.unresolvedProjects!==0||coordinateStatus.resolvedProjects!==coordinateStatus.totalProjects) throw new Error("GIS coordinate coverage is incomplete.");
          if(coordinates.projects.some(p=>p.method==="official-citywide-reference"&&p.scope!=="citywide")) throw new Error("A non-citywide project received a citywide GIS reference.");
          if(!Array.isArray(eventStatus.sources)||!eventStatus.sources.length) throw new Error("Event collection produced no source health records.");
          if(eventsSucceeded&&(eventStatus.successfulSources!==eventStatus.sources.length||eventStatus.failedSources!==0)) throw new Error("Event collection reported success but one or more official sources failed.");
          console.log("Projects found:",data.projects.length); console.log("GIS coordinates:",coordinates.projects.length); console.log("GIS exact locations:",coordinateStatus.exactLocations); console.log("GIS reference locations:",coordinateStatus.referenceLocations); console.log("Event refresh succeeded:",eventsSucceeded);'
        env:
          EVENTS_SUCCEEDED: ${{ steps.events.outcome == 'success' }}
      - name: Run lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Configure Git
        run: |
          git config user.name "Newton Development Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check for changes
        id: changes
        run: |
          if [ "${{ steps.events.outcome }}" = "success" ]; then FILES="data/newton-source.json data/projects.ts data/project-events.ts data/event-collection-status.json data/project-coordinates.json data/coordinate-collection-status.json"; else FILES="data/newton-source.json data/projects.ts data/project-coordinates.json data/coordinate-collection-status.json"; fi
          if git diff --quiet -- $FILES; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; git diff --stat -- $FILES; fi
      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ "${{ steps.events.outcome }}" = "success" ]; then git add data/newton-source.json data/projects.ts data/project-events.ts data/event-collection-status.json data/project-coordinates.json data/coordinate-collection-status.json; else git add data/newton-source.json data/projects.ts data/project-coordinates.json data/coordinate-collection-status.json; fi
          git commit -m "Update Newton development data"
      - name: Sync with latest main
        if: steps.changes.outputs.changed == 'true'
        run: git fetch origin main && git rebase origin/main
      - name: Push updated data
        if: steps.changes.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Report result
        run: |
          echo "### Newton Development refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.events.outcome }}" != "success" ]; then echo "Core project and GIS refresh completed; event-source refresh was unavailable and its generated files were not published." >> "$GITHUB_STEP_SUMMARY"; else echo "Project, GIS, event validation, lint, and production build completed." >> "$GITHUB_STEP_SUMMARY"; fi
