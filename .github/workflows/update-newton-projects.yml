name: Update Newton Development Projects

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update Newton projects
        run: node scripts/update-newton-projects.mjs

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/newton-source.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated Newton data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Newton Development Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newton-source.json
          git commit -m "Update Newton development data"
          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "Newton project data has not changed."